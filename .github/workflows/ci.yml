name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  test-build-audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Run tests
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Build and verify member-roll privacy
        run: npm run build
